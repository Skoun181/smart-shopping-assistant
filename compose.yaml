services:
  shopping:
    build: .
    image: smart-shopping-assistant:1.0.6
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATABASE_PATH: /data/shopping.db
      HOST: 0.0.0.0
      PORT: 3000
    ports:
      # Direct LAN and reverse proxy access; restrict via host/network firewall.
      - "0.0.0.0:${APP_PORT:-3000}:3000"
    volumes:
      - shopping_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
volumes:
  shopping_data:
