# No .env required. Edit the image tag and host port directly.
services:
  shopping:
    build: .
    image: smart-shopping-assistant:1.0.7
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    volumes:
      - shopping_data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=64m
volumes:
  shopping_data:
