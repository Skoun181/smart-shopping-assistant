# On the separate NGINX VM (192.168.0.66), HTTP test only.
# For TLS use your existing HTTPS virtual host and trusted certificate.
server {
    listen 80;
    server_name list.xc.local;
    if ($host != list.xc.local) { return 444; }
    location / {
        proxy_pass http://192.168.0.150:3001;
        proxy_http_version 1.1;
        proxy_set_header Host list.xc.local;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 6m;
    }
}
