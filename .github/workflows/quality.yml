name: Beta quality checks
on:
  push:
    branches: ['feature/**', main]
  pull_request:
    branches: [main, feature/beta-0.1-foundation, feature/onboarding-tiles-categories]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Check types and Svelte
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Docker image
        run: docker build -t smart-shopping-beta .
      - name: Smoke test container and APIs
        run: |
          set -euo pipefail
          HASH="$(node tests/ci-password.mjs)"
          docker run -d --rm --name shopping-smoke -p 127.0.0.1:3333:3000 -e ORIGIN=http://127.0.0.1:3333 -e APP_PASSWORD_HASH="$HASH" smart-shopping-beta
          trap 'docker logs shopping-smoke || true; docker rm -f shopping-smoke || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3333/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node tests/smoke.mjs
