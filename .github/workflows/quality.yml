name: Beta quality checks
on:
  push:
    branches: ['feature/**', main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-fund
      - name: Check types and Svelte
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Docker image
        run: docker build -t smart-shopping-beta .
