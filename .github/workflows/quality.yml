name: Quality and stable release
on:
  push:
    branches: ['develop/**', 'stable/**']
  pull_request:
    branches: ['develop/**', 'stable/**']
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Check types and Svelte
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
      - name: Validate pull-only Compose file
        run: |
          set -euo pipefail
          cp .env.example .env
          trap 'rm -f .env' EXIT
          docker compose -f compose.registry.yaml config --quiet
          docker compose -f compose.registry.yaml config --images | grep -Fx 'ghcr.io/skoun181/smart-shopping-assistant:1.0.6'
      - name: Docker image
        run: docker build -t smart-shopping-ci .
      - name: Smoke test container and APIs
        run: |
          set -euo pipefail
          HASH="$(node tests/ci-password.mjs)"
          docker run -d --rm --name shopping-smoke -p 127.0.0.1:3333:3000 -e ORIGIN=http://legacy.invalid:9999 -e APP_PASSWORD_HASH="$HASH" smart-shopping-ci
          trap 'docker logs shopping-smoke || true; docker rm -f shopping-smoke || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3333/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node tests/smoke.mjs
          node tests/network-smoke.mjs

  release-v106:
    # Publish the explicitly approved v1.0.6 stable version only after the stable branch passes quality.
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable/smart-shopping-assistant'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: stable-release-v106
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Publish v1.0.6 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(node -p "require('./package.json').version")" != "1.0.6" ]; then
            echo "Not the v1.0.6 release version"
            exit 0
          fi
          if gh release view v1.0.6 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.6 already published; leaving it untouched"
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.0.6" >/dev/null 2>&1; then
            echo "Tag exists without release; refusing to move or reuse it automatically"
            exit 1
          fi
          gh release create v1.0.6 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Version 1.0.6 Stable" --notes-file RELEASE_NOTES.md --latest

  publish-container:
    # Only publish the approved release, never a development or PR build.
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable/smart-shopping-assistant'
    needs: [quality, release-v106]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    concurrency:
      group: stable-container-publish
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      IMAGE: ghcr.io/skoun181/smart-shopping-assistant
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify approved release and check out its exact source
        id: release
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName' | grep -Fx "$tag"
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          revision="$(git rev-parse "$tag^{commit}")"
          git merge-base --is-ancestor "$revision" "$GITHUB_SHA"
          git checkout --detach "$revision"
          test "$(node -p "require('./package.json').version")" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - name: Build and test the release image (Linux amd64)
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$REVISION" \
            -t "$IMAGE:$VERSION" .
          HASH="$(node tests/ci-password.mjs)"
          docker run -d --rm --name shopping-registry-smoke -p 127.0.0.1:3333:3000 -e APP_PASSWORD_HASH="$HASH" "$IMAGE:$VERSION"
          trap 'docker logs shopping-registry-smoke || true; docker rm -f shopping-registry-smoke || true' EXIT
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3333/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          node tests/smoke.mjs
          node tests/network-smoke.mjs
      - name: Publish tested image to GHCR
        env:
          VERSION: ${{ steps.release.outputs.version }}
          REVISION: ${{ steps.release.outputs.revision }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            # Keep the already published version unchanged on re-runs.
            docker pull "$IMAGE:$VERSION"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE:$VERSION")" = "$REVISION"
          else
            docker push "$IMAGE:$VERSION"
          fi
          if [ "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "v$VERSION" ]; then
            docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          docker manifest inspect "$IMAGE:$VERSION" >/dev/null
          echo "Published $IMAGE:$VERSION"
